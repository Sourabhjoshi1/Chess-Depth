# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Check Shop product files
        run: |
          ruby -ryaml -e '
            ok = YAML.safe_load(File.read("_data/shop.yml", encoding: "UTF-8")).map { |c| c["id"] }
            bad = []
            Dir["_products/*.md"].sort.each do |f|
              fm = File.read(f, encoding: "UTF-8")[/\A---\s*\n(.*?)\n---/m, 1]
              begin
                d = YAML.safe_load(fm.to_s) || {}
              rescue => e
                bad << "#{f}: settings could not be read (put text containing a colon in double quotes) - #{e.message.lines.first.strip}"
                next
              end
              bad << "#{f}: missing title" if d["title"].to_s.empty?
              bad << "#{f}: category must be one of #{ok.join(", ")}" unless ok.include?(d["category"])
            end
            if bad.any? then puts bad; exit 1 else puts "All #{Dir["_products/*.md"].size} products OK" end'
      - name: Setup Node (for the trimmed Tailwind CSS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build trimmed Tailwind CSS
        run: |
          npm install --prefix "$RUNNER_TEMP/tw" --no-audit --no-fund tailwindcss@2.2.19 postcss@8 autoprefixer@10
          NODE_ENV=production "$RUNNER_TEMP/tw/node_modules/.bin/tailwindcss" -c tailwind.config.js -i src/tailwind.css -o assets/css/tailwind.min.css --minify
          ls -la assets/css/tailwind.min.css
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
