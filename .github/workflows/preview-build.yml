# TEMPORARY: builds the 'restructure' branch with GitHub Pages' Jekyll and
# saves the generated site to the 'restructure-preview' branch for checking.
# Does not deploy anything. Will be removed before merging.
name: Preview build (temporary)
on:
  push:
    branches: ["restructure"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Save built site to restructure-preview branch
        run: |
          cd _site
          sudo chown -R "$(id -u)" .
          git init -q -b restructure-preview
          git config user.name "preview-bot"; git config user.email "preview@users.noreply.github.com"
          git add -A && git commit -q -m "Preview build of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" restructure-preview
