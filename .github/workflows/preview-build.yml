# TEMPORARY preview build (no deploy). Removed before merging.
name: Preview build (temporary)
on:
  push:
    branches: ["seo"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build trimmed Tailwind CSS
        run: |
          npm install --no-save --no-audit --no-fund tailwindcss@2.2.19 postcss@8 autoprefixer@10
          NODE_ENV=production npx tailwindcss -c tailwind.config.js -i src/tailwind.css -o assets/css/tailwind.min.css --minify
          ls -la assets/css/tailwind.min.css
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Save built site
        run: |
          cd _site
          sudo chown -R "$(id -u)" .
          git init -q -b restructure-preview
          git config user.name "preview-bot"; git config user.email "preview@users.noreply.github.com"
          git add -A && git commit -q -m "Preview build of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" restructure-preview
