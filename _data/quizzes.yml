# Weekly quizzes shown in the Student Area ("This week's quiz").
# Add the newest quiz at the TOP. Fields:
#   title    - name students see
#   level    - Beginner / Intermediate / Advanced / All levels
#   opens    - first day it shows as "this week's quiz" (YYYY-MM-DD)
#   closes   - last day to submit (YYYY-MM-DD). After this it moves to "Past quizzes".
#   url      - the Google Form link to send students (Send > link). Leave "" until the form is ready.
#   questions, minutes, points - shown on the card
#   topics   - one short line
#   key      - optional link to the answer key or a review (shown only after the quiz closes)
