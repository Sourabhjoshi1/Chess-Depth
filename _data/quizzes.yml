# Quizzes in the Student Area, grouped by level. Students can open any quiz at any time.
# To add a quiz: find its level and fill in (or add) an entry. Fields:
#   title     - name students see
#   url       - the Google Form link (Send > link). Leave "" and the card shows "Coming soon".
#   questions, minutes, points - shown on the card
#   topics    - one short line about what it covers
- level: Beginner
  ratings: "Up to 1000"
  icon: fa-chess-pawn
  quizzes:
    - title: "Beginner Quiz 1"
      url: "https://docs.google.com/forms/d/e/1FAIpQLSdm6A-XrTaXIsFneirdf5QXX3M4jYuMwNmS_LRhOag8MZ0FVQ/viewform"
      questions: 30
      minutes: 45
      points: 40
      topics: "Rules, piece values, checkmate and stalemate + simple tactics: mate in 1, free pieces, forks, pins"
    - title: "Beginner Quiz 2"
      url: ""
      questions: 30
      minutes: 45
      points: 43
      topics: "Check, notation, draws and opening habits + mates, forks, pins and skewers"
    - title: "Beginner Quiz 3"
      url: ""
      questions: 30
      minutes: 45
      points: 47
      topics: "Forks, pins, skewers, discovered attacks, back-rank danger and basic endgames"
