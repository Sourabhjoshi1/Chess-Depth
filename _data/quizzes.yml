# Quizzes in the Student Area, grouped by level. Only ChessDepth Academy students (linked enrollment
# number) can open them. The Google Form links are NOT stored here (this file is public): paste each
# link on the admin page (/lab/admin/ > Quiz links), where it is saved in Firebase and only shown to
# academy students. Fields:
#   id        - permanent id used to store the link (lowercase, digits and -). Don't change it later.
#   title     - name students see
#   questions, minutes, points - shown on the card
#   topics    - one short line about what it covers
- level: Beginner
  ratings: "Up to 1000"
  icon: fa-chess-pawn
  quizzes:
    - id: beginner-1
      title: "Beginner Quiz 1"
      questions: 30
      minutes: 45
      points: 40
      topics: "Rules, piece values, checkmate and stalemate + simple tactics: mate in 1, free pieces, forks, pins"
    - id: beginner-2
      title: "Beginner Quiz 2"
      questions: 30
      minutes: 45
      points: 43
      topics: "Check, notation, draws and opening habits + mates, forks, pins and skewers"
    - id: beginner-3
      title: "Beginner Quiz 3"
      questions: 30
      minutes: 45
      points: 47
      topics: "Forks, pins, skewers, discovered attacks, back-rank danger and basic endgames"
- level: Intermediate
  ratings: "1000 to 1500"
  icon: fa-chess-knight
  quizzes:
    - id: intermediate-1
      title: "Intermediate Quiz 1"
      questions: 30
      minutes: 45
      points: 47
      topics: "18 puzzles (forks, skewers, mates, endgames) + opposition, Lucena, Philidor, outposts and pawn structures"
    - id: intermediate-2
      title: "Intermediate Quiz 2"
      questions: 30
      minutes: 45
      points: 48
      topics: "18 puzzles + zugzwang, key squares, pawn majorities and rook endgames"
    - id: intermediate-3
      title: "Intermediate Quiz 3"
      topics: ""
- level: Advanced
  ratings: "1500 to 1900"
  icon: fa-chess-rook
  quizzes:
    - id: advanced-1
      title: "Advanced Quiz 1"
    - id: advanced-2
      title: "Advanced Quiz 2"
    - id: advanced-3
      title: "Advanced Quiz 3"
- level: Elite
