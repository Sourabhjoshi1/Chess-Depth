# Courses listed for Google (structured data). Keep in step with the course cards on the Courses page.
- name: "Complete Summer Chess Course"
  description: "Our intensive summer-break program covering openings, middlegames, and endgames, with weekly tournaments. The 2026 batch has finished — message us to be told when the next batch opens."
- name: "Beginner's Blueprint: Master the Basics"
  description: "Start your chess journey right! Learn piece movements, basic checkmates, forks, pins, and essential opening principles. Perfect for absolute beginners."
- name: "Beyond the Basics: Solidifying Your Foundation"
  description: "You know the rules, now learn to play! This course focuses on developing sound strategic thinking, improving tactical vision, and understanding simple endgames."
- name: "Intermediate Positional Play: Beyond Tactics"
  description: "Move beyond simple tactics and delve into the art of positional chess. Learn about pawn structures, weak squares, piece activity, and prophylactic thinking."
- name: "Advanced Opening Repertoire: Dominate from Move 1"
  description: "Build a robust and dynamic opening repertoire for both White and Black. Understand the ideas behind the moves and gain a significant edge early in the game."
- name: "Endgame Mastery: The Art of Conversion"
  description: "Learn the critical techniques to convert advantages in the endgame. Study pawn endgames, rook endgames, and advanced king activity concepts."
- name: "Chess Psychology: Master Your Mind"
  description: "Develop mental resilience, improve concentration, and learn to handle pressure in crucial moments. Essential for competitive players."
- name: "Chess for Corporate Professionals"
  description: "Enhance strategic thinking, problem-solving, and decision-making skills applicable to the corporate world. Learn the fundamentals of chess in a professional context."
- name: "Scholastic Chess: Nurturing Young Minds"
  description: "A fun and engaging program designed specifically for children and teenagers to develop critical thinking, patience, and sportsmanship through chess."
- name: "Private Coaching & Game Analysis"
  description: "Receive one-on-one tailored coaching sessions and in-depth analysis of your games to identify strengths, weaknesses, and a personalized improvement plan."
- name: "Tournament Preparation & Mindset"
  description: "Elevate your tournament performance. This course covers pregame routines, in-game decision making, post-game analysis, and mental fortitude for competitive play."
- name: "Blitz & Rapid Play Mastery"
  description: "Improve your performance in fast time controls. Focus on quick pattern recognition, time management, and practical decision-making under pressure."
- name: "Advanced Tactics & Combinations"
  description: "Dive deep into complex tactical motifs, sacrifice patterns, and multi-move combinations. Sharpen your calculation and visualization skills."
