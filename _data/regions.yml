# Country / region landing pages for families outside India (pages/regions/*.html use _includes/region-page.html).
# Time differences: India (IST) is UTC+5:30 all year; "summer" means daylight saving time in that region.
usa:
  name: "the USA and Canada"
  short: "USA & Canada"
  url: /online-chess-classes-usa/
  eyebrow: "For families in the USA and Canada · Live online"
  h1: "Online chess classes for families in the USA and Canada"
  lead: "Live one-to-one and small-group lessons with FIDE-rated coaches, including a Grandmaster and an International Master. Fees in US dollars, and class times that fit your time zone."
  zones:
    - ["Eastern: New York, Toronto, Miami", "10½ hours ahead (9½ in summer)"]
    - ["Central: Chicago, Houston, Winnipeg", "11½ hours ahead (10½ in summer)"]
    - ["Mountain: Denver, Calgary, Phoenix", "12½ hours ahead (11½ in summer; Phoenix 12½ all year)"]
    - ["Pacific: Los Angeles, Seattle, Vancouver", "13½ hours ahead (12½ in summer)"]
  time_note: "India is ahead of you, so your evening is the next morning in India, and your weekend morning is the evening in India. Tell us the times that suit your family and we'll match you with a coach who can teach then."
  currency: "US or Canadian dollars"
  ratings: "Tournament players get preparation for rated events, whether US Chess, the Chess Federation of Canada or FIDE."
  extra_h: "Built for busy families"
  extra:
    - ["fa-clock", "Your schedule, not ours", "One-to-one class times are fixed around school, sports and work. We confirm each time in your local time."]
    - ["fa-dollar-sign", "Simple fees in US$", "One monthly fee that includes all classes, worksheets and quizzes, with no sign-up fee."]
    - ["fa-trophy", "From first moves to rated events", "Children start with the basics; tournament players prepare for scholastic and rated events."]
usa_wa: "Hi%2C%20I%20am%20in%20the%20USA%2FCanada%20and%20would%20like%20to%20book%20a%20free%20demo%20chess%20class"

