<meta charset="UTF-8">
  <script>
    /* Night/day mode: use the saved choice, otherwise follow the device setting */
    (function () {
      var t = null; try { t = localStorage.getItem("cd-theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") t = (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
      if (t === "dark") document.documentElement.classList.add("dark");
    })();
  </script>
  <meta name="theme-color" content="#4338ca">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{{ page.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/images/og-image.jpg' | absolute_url }}">
  <meta name="twitter:card" content="summary_large_image">
  {%- if page.noindex %}
  <meta name="robots" content="noindex">
  {%- endif %}
  <link rel="icon" type="image/x-icon" href="/assets/images/favicon.ico">
  {%- if page.ads != false %}
  <meta name="google-adsense-account" content="{{ site.adsense_client }}">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ site.adsense_client }}" crossorigin="anonymous"></script>
  {%- endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  {%- if page.page_css %}
  <link rel="stylesheet" href="/assets/css/pages/{{ page.page_css }}.css">
  {%- endif %}
  <link rel="stylesheet" href="/assets/css/site.css">
  <link rel="stylesheet" href="/assets/css/dark.css">
  {%- for s in page.head_scripts %}
  <script {% if s.type %}type="{{ s.type }}" {% endif %}src="{{ s.src }}"></script>
  {%- endfor %}
  {%- if page.url == "/" %}
  <script type="application/ld+json">
  {"@context": "https://schema.org", "@type": "EducationalOrganization", "name": "{{ site.title }}", "url": "{{ site.url }}/", "logo": "{{ '/assets/images/og-image.jpg' | absolute_url }}", "telephone": "+{{ site.contact.phone_intl }}", "email": "{{ site.contact.email }}", "address": {"@type": "PostalAddress", "addressLocality": "Bhopal", "addressRegion": "Madhya Pradesh", "addressCountry": "IN"}, "sameAs": ["{{ site.contact.instagram }}", "{{ site.contact.facebook }}"]}
  </script>
  {%- endif %}
