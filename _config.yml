# ChessDepth Academy - site settings
# Change contact details here once and they update on every page.
title: ChessDepth Academy
description: Structured online chess coaching for beginners to tournament players.
url: "https://www.chessdepth.in"
baseurl: ""

contact:
  phone_display: "+91 98230 29262"
  phone_intl: "919823029262"
  email: "info@chessdepth.in"
  address: "Bhopal, Madhya Pradesh, India"
  instagram: "https://www.instagram.com/chessdepthacademy1/"
  facebook: "https://www.facebook.com/chessdepthacademy/"
  whatsapp_text: "Hi%2C%20I%20would%20like%20to%20book%20a%20free%20demo%20class"

adsense_client: "ca-pub-1353516013773606"

# Chess Lab (paid membership)
lab:
  price: ""            # e.g. "₹299 / month". Empty shows "Pricing announced at launch".
  payment_link: ""     # Razorpay payment link. Empty shows an "Ask to join on WhatsApp" button.
  free_until: "2026-11-21"   # Launch offer: everything free for signed-in users until the end of this day. Empty = no offer.
  admins:              # Google accounts that can switch Lab access on/off at /lab/admin/
    - joshisourabh47@gmail.com

# Google Analytics 4 "Measurement ID" (looks like G-XXXXXXXXXX). Leave empty to switch analytics off.
google_analytics: "G-2C73E30ZFX"
# Google Search Console "HTML tag" verification code (only the content="..." value).
google_site_verification: ""

# Shop: digital products sold through Gumroad. Each product is one file in _products/.
shop:
  gumroad_profile: ""   # e.g. "https://chessdepth.gumroad.com" (shown as "See all on Gumroad"). Empty hides it.

collections:
  products:
    output: true
    permalink: /shop/:name/

# Clean URLs: /about/ instead of /about.html
permalink: pretty

plugins:
  - jekyll-redirect-from
  - jekyll-sitemap

defaults:
  - scope: { path: "" }
    values: { layout: default }
  # Blog posts live in _posts/ as YYYY-MM-DD-title.md and appear at /blog/title/
  - scope: { path: "", type: posts }
    values:
      layout: post
      permalink: /blog/:title/
      page_css: blog
      author: ChessDepth Coaching Team
  - scope: { path: "", type: products }
    values:
      layout: product
      page_css: shop

exclude:
  - README.md
  - "README.md # Project documentation"
  - Contributing.md
  - EDITING.md
  - LICENSE
  - firebase
  - shop-src
  - Gemfile
  - Gemfile.lock
  - tailwind.config.js
  - src
  - package.json
  - package-lock.json
  - node_modules
  - vendor
  - .github
